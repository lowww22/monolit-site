# Публикация сайта на GitHub Pages.
# Запускается сама при каждой отправке кода в ветку main.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove server routes
        # На GitHub Pages нет сервера, поэтому серверные маршруты
        # исключаются из этой сборки. В основном коде они остаются.
        run: rm -rf app/api

      - name: Build static site
        env:
          STATIC_EXPORT: "1"
          # Сайт живёт в корне своего домена, подпапка не нужна —
          # иначе ломаются пути к фотографиям.
          NEXT_PUBLIC_SITE_URL: https://monolit-glazovbeton.ru
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # После публикации сообщаем Яндексу адреса всех страниц по протоколу
  # IndexNow — так новые и изменённые страницы попадают в поиск быстрее.
  # Если Яндекс не ответит, на сам сайт это никак не влияет.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Send page URLs to Yandex IndexNow
        env:
          HOST: monolit-glazovbeton.ru
          KEY: 5b6096476e43430691dbf2a8c671ed8f
        run: |
          # Даём новой версии сайта разойтись по серверам GitHub Pages
          sleep 60
          curl -fsS "https://$HOST/sitemap.xml" -o sitemap.xml
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's/<loc>//' -e 's/<\/loc>//' | jq -R . | jq -s -c .)
          BODY=$(jq -n -c --arg host "$HOST" --arg key "$KEY" --argjson urls "$URLS" \
            '{host: $host, key: $key, keyLocation: ("https://" + $host + "/" + $key + ".txt"), urlList: $urls}')
          curl -sS -X POST "https://yandex.com/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$BODY" -w "\nHTTP %{http_code}\n"
